<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alforje</title>

<style>

/* RESET */
* {
  box-sizing: border-box;
}

/* BASE MOBILE FIRST */
body {
  margin: 0;
  background: #111;
  color: #f5f5f5;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  padding: 48px 22px 60px 22px; /* respiro lateral elegante */
  display: flex;
  justify-content: center;
}

/* CONTAINER CENTRAL */
.container {
  width: 100%;
  max-width: 480px;
}

/* LOGO */
.logo {
  width: 65%;
  max-width: 260px;
  margin: 0 auto 36px auto;
  display: block;
}

/* LOADING */
#loadingScreen {
  text-align: center;
}

.loader {
  margin: 20px auto 0 auto;
  width: 32px;
  height: 32px;
  border: 3px solid rgba(255,255,255,0.15);
  border-top: 3px solid #ffcb3d;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

/* CONTEÚDO FINAL */
#content {
  display: none;
  text-align: center;
  animation: fadeIn 1.6s ease forwards;
  opacity: 0;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

h2 {
  font-size: 24px;
  font-weight: 500;
  margin-bottom: 26px;
}

p {
  font-size: 16px;
  line-height: 1.85;
  opacity: 0.9;
}

.highlight {
  color: #edf3ff;
  font-weight: bold;
}

</style>
</head>

<body>

<div class="container">

  <!-- TELA DE LOADING -->
  <div id="loadingScreen">
    <img src="alforje_logo.png" class="logo" alt="Alforje Logo">
    <div class="loader"></div>
  </div>

  <!-- CONTEÚDO PRINCIPAL -->
  <div id="content">
    <img src="alforje_logo.png" class="logo" alt="Alforje Logo">
    <h2 id="titulo">Carregando...</h2>
    <p id="descricao"></p>
  </div>

</div>

<script>
function param(nome) {
  return new URL(window.location.href).searchParams.get(nome);
}

const pedido = param("p");
const titulo = document.getElementById("titulo");
const descricao = document.getElementById("descricao");

setTimeout(() => {

  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("content").style.display = "block";

  if (!pedido) {
    titulo.innerHTML = "Pedido não informado";
    descricao.innerHTML = "Nenhum código foi encontrado.";
    return;
  }

  fetch("data.json")
    .then(response => response.json())
    .then(data => {

      if (!data[pedido]) {
        titulo.innerHTML = "Pedido não encontrado";
        descricao.innerHTML = `Código: <span class="highlight">${pedido}</span>`;
        return;
      }

      const info = data[pedido];

      titulo.innerHTML = `Olá, <span class="highlight">${info.cliente}</span>!`;

      descricao.innerHTML = `
        É um prazer imenso para a <span class="highlight">ALFORJE</span> 
        desenvolver uma fragrância que carrega um pedacinho da sua identidade.

        <br><br>

        Desenvolvemos uma inspiração totalmente exclusiva do <span class="highlight">${info.perfume}</span>
        especialmente para você, construída a partir das notas de 
        ${info.notas}, cuidadosamente equilibradas para expressar presença, 
        autenticidade e personalidade.

        <br><br>

        Na <span class="highlight">ALFORJE</span> nenhum perfume é igual ao outro, assim como nenhuma
        pessoa também é, e este foi feito exclusivamente para você.
      `;
    })
    .catch(() => {
      titulo.innerHTML = "Erro ao carregar";
      descricao.innerHTML = "Não foi possível carregar os dados.";
    });

}, 3000);

</script>

</body>
</html>
