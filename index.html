<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alforje</title>

<style>

/* RESET */
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: #f5f5f5;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
}

/* ===== LOADING (CENTRALIZADO NO MEIO) ===== */
#loadingScreen {
  position: fixed;
  inset: 0;
  background: #111;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

.loader {
  margin-top: 18px;
  width: 28px;
  height: 28px;
  border: 3px solid rgba(255,255,255,0.15);
  border-top: 3px solid #ffcb3d;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

/* ===== CONTEÚDO NORMAL (COMO ESTAVA ANTES) ===== */

.container {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding: 48px 22px 60px 22px;
  text-align: center;
}

.logo {
  width: 65%;
  max-width: 260px;
  margin: 0 auto 36px auto;
  display: block;
}

#content {
  display: none;
  animation: fadeIn 1.4s ease forwards;
  opacity: 0;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

h2 {
  font-size: 22px;
  font-weight: 500;
  margin-bottom: 22px;
}

p {
  font-size: 14.5px;
  line-height: 1.6;
  opacity: 0.9;
  letter-spacing: 0.2px;
}

.highlight {
  color: #ffdd80;
  font-weight: 600;
}

</style>
</head>

<body>

<!-- ===== LOADING ===== -->
<div id="loadingScreen">
  <img src="alforje_logo.png" class="logo" alt="Alforje Logo">
  <div class="loader"></div>
</div>

<!-- ===== CONTEÚDO ===== -->
<div class="container">
  <div id="content">
    <img src="alforje_logo.png" class="logo" alt="Alforje Logo">
    <h2 id="titulo">Carregando...</h2>
    <p id="descricao"></p>
  </div>
</div>

<script>
function param(nome) {
  return new URL(window.location.href).searchParams.get(nome);
}

const pedido = param("p");
const titulo = document.getElementById("titulo");
const descricao = document.getElementById("descricao");

setTimeout(() => {

  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("content").style.display = "block";

  if (!pedido) {
    titulo.innerHTML = "Pedido não informado";
    descricao.innerHTML = "Nenhum código foi encontrado.";
    return;
  }

  fetch("data.json")
    .then(response => response.json())
    .then(data => {

      if (!data[pedido]) {
        titulo.innerHTML = "Pedido não encontrado";
        descricao.innerHTML = `Código: <span class="highlight">${pedido}</span>`;
        return;
      }

      const info = data[pedido];

      titulo.innerHTML = `<br>Olá, <span class="highlight">${info.cliente}</span>!`;

      descricao.innerHTML = `
        É um prazer imenso para a <span class="highlight">ALFORJE</span> desenvolver uma fragrância que carrega um pedacinho da sua identidade.
        <br><br>
        Desenvolvemos uma inspiração totalmente exclusiva do <span class="highlight">${info.perfume}</span> especialmente para você, construída a partir das notas de ${info.notas}, cuidadosamente equilibradas para expressar presença, autenticidade e personalidade.
        <br><br>
        Na <span class="highlight">ALFORJE</span> nenhum perfume é igual ao outro, assim como nenhuma pessoa também é, e este foi feito exclusivamente para você.
        <br><br>
        Exale-se!
      `;
    })
    .catch(() => {
      titulo.innerHTML = "Erro ao carregar";
      descricao.innerHTML = "Não foi possível carregar os dados.";
    });

}, 4000); // 4 segundos

</script>

</body>
</html>
