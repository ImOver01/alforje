<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alforje</title>

<style>

/* RESET */
* {
  box-sizing: border-box;
}

/* BODY CENTRALIZADO VERTICAL */
body {
  margin: 0;
  background: #111;
  color: #f5f5f5;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 24px;
}

/* CONTAINER */
.container {
  width: 100%;
  max-width: 420px;
  text-align: center;
}

/* LOGO */
.logo {
  width: 65%;
  max-width: 240px;
  margin: 0 auto 28px auto;
  display: block;
}

/* LOADING */
.loader {
  margin: 16px auto 0 auto;
  width: 28px;
  height: 28px;
  border: 3px solid rgba(255,255,255,0.15);
  border-top: 3px solid #ffcb3d;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

/* CONTEÚDO FINAL */
#content {
  display: none;
  animation: fadeIn 1.4s ease forwards;
  opacity: 0;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

h2 {
  font-size: 22px;
  font-weight: 500;
  margin-bottom: 22px;
}

p {
  font-size: 14.5px;
  line-height: 1.6;
  opacity: 0.9;
  letter-spacing: 0.2px;
}

.highlight {
  color: #ffdd80;
  font-weight: 600;
}

</style>
</head>

<body>

<div class="container">

  <!-- TELA DE LOADING -->
  <div id="loadingScreen">
    <img src="alforje_logo.png" class="logo" alt="Alforje Logo">
    <div class="loader"></div>
  </div>

  <!-- CONTEÚDO -->
  <div id="content">
    <img src="alforje_logo.png" class="logo" alt="Alforje Logo">
    <h2 id="titulo">Carregando...</h2>
    <p id="descricao"></p>
  </div>

</div>

<script>
function param(nome) {
  return new URL(window.location.href).searchParams.get(nome);
}

const pedido = param("p");
const titulo = document.getElementById("titulo");
const descricao = document.getElementById("descricao");

setTimeout(() => {

  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("content").style.display = "block";

  if (!pedido) {
    titulo.innerHTML = "Pedido não informado";
    descricao.innerHTML = "Nenhum código foi encontrado.";
    return;
  }

  fetch("data.json")
    .then(response => response.json())
    .then(data => {

      if (!data[pedido]) {
        titulo.innerHTML = "Pedido não encontrado";
        descricao.innerHTML = `Código: <span class="highlight">${pedido}</span>`;
        return;
      }

      const info = data[pedido];

      titulo.innerHTML = `Olá, <span class="highlight">${info.cliente}</span>!`;

      descricao.innerHTML = `
        A <span class="highlight">ALFORJE</span> criou 
        <span class="highlight">${info.perfume}</span> exclusivamente para você.

        <br><br>

        Desenvolvido a partir das notas de ${info.notas},
        esta fragrância traduz sua identidade em uma composição única.

        <br><br>

        Esta unidade é exclusiva. Não existe outra igual.
      `;
    })
    .catch(() => {
      titulo.innerHTML = "Erro ao carregar";
      descricao.innerHTML = "Não foi possível carregar os dados.";
    });

}, 4000); // 4 segundos

</script>

</body>
</html>
