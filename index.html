<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alforje</title>

<style>
body {
  margin: 0;
  padding: 0;
  background: #111;
  color: #fff;
  font-family: "Helvetica Neue", Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  text-align: center;
}

/* LOGO */
.logo {
  width: 65%;
  max-width: 280px;
  margin-bottom: 30px;
}

/* LOADING SCREEN */
#loadingScreen {
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Spinner elegante */
.loader {
  width: 35px;
  height: 35px;
  border: 3px solid rgba(255,255,255,0.2);
  border-top: 3px solid #e5c890;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

/* CONTEÚDO FINAL */
#content {
  display: none;
  flex-direction: column;
  align-items: center;
  animation: fadeIn 1.5s ease forwards;
  opacity: 0;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

.highlight {
  color: #e5c890;
  font-weight: bold;
}

p {
  max-width: 420px;
  opacity: 0.85;
  line-height: 1.6;
}
</style>
</head>

<body>

<!-- TELA DE CARREGAMENTO -->
<div id="loadingScreen">
  <img src="alforje_logo.png" class="logo" alt="Alforje Logo">
  <div class="loader"></div>
</div>

<!-- CONTEÚDO FINAL -->
<div id="content">
  <img src="alforje_logo.png" class="logo" alt="Alforje Logo">
  <h2 id="titulo">Carregando...</h2>
  <p id="descricao"></p>
</div>

<script>
function param(nome) {
  return new URL(window.location.href).searchParams.get(nome);
}

const pedido = param("p");

const titulo = document.getElementById("titulo");
const descricao = document.getElementById("descricao");

setTimeout(() => {
  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("content").style.display = "flex";

  if (!pedido) {
    titulo.innerHTML = "Pedido não informado";
    descricao.innerHTML = "Nenhum código foi encontrado.";
    return;
  }

  fetch("data.json")
    .then(response => response.json())
    .then(data => {

      if (!data[pedido]) {
        titulo.innerHTML = "Pedido não encontrado";
        descricao.innerHTML = `Código: <span class="highlight">${pedido}</span>`;
        return;
      }

      const info = data[pedido];

      titulo.innerHTML = `Olá, <span class="highlight">${info.cliente}</span>!`;

      descricao.innerHTML = `
        Seu perfume <span class="highlight">${info.perfume}</span> está pronto.<br><br>
        <strong>Notas olfativas:</strong><br>
        ${info.notas}
      `;
    })
    .catch(() => {
      titulo.innerHTML = "Erro ao carregar";
      descricao.innerHTML = "Não foi possível carregar os dados.";
    });

}, 3000); // 3 segundos de loading
</script>

</body>
</html>
